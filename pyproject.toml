[project]
name = "rag-document-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jayant Prakash", email = "prakash1.jayant@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "faiss-cpu>=1.14.3",
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.3.2",
    "langgraph>=1.2.5",
    "openai>=2.41.1",
    "pypdf>=6.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.58.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
rag-document-search = "rag_document_search:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
